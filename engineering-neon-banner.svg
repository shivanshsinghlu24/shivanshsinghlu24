<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Shivansh Singh — Mechanical Engineering</title>
<desc id="desc">Animated engineering banner with rotating gears, a moving piston, blueprint grid and cyan, steel-blue and amber highlights.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b16"/><stop offset=".55" stop-color="#0a1b2c"/><stop offset="1" stop-color="#152235"/></linearGradient>
 <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e3f4ff"/><stop offset=".5" stop-color="#638ba8"/><stop offset="1" stop-color="#d0e8f4"/></linearGradient>
 <linearGradient id="amber"><stop stop-color="#ff8735"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
 <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#83bddb" stroke-opacity=".12"/><circle r="1" fill="#27e7ff" fill-opacity=".25"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <g id="tooth"><rect x="-7" y="-83" width="14" height="22" rx="2" fill="url(#steel)" stroke="#8cecff"/></g>
 <g id="toothSmall"><rect x="-5" y="-43" width="10" height="14" rx="1" fill="#ffad5c" stroke="#ffe0a8"/></g>
</defs>
<rect width="1200" height="360" rx="18" fill="url(#bg)"/><rect width="1200" height="360" rx="18" fill="url(#grid)"/>
<path d="M0 280H1200M0 285H1200" stroke="#21dff8" stroke-opacity=".5"/>
<rect x="-130" width="90" height="360" fill="#00d9ff" opacity=".07"><animate attributeName="x" values="-130;1240" dur="8s" repeatCount="indefinite"/></rect>
<g font-family="Arial,Helvetica,sans-serif">
 <text x="66" y="66" font-size="15" fill="#36e5ff" letter-spacing="4">MECHANICAL ENGINEERING / DIGITAL WORKSHOP</text>
 <path d="M68 82H405" stroke="#00d9ff" stroke-width="2" stroke-opacity=".65"/>
 <text x="62" y="151" font-size="52" font-weight="700" letter-spacing="1" fill="#f1f7ff">SHIVANSH SINGH</text>
 <text x="66" y="193" font-size="18" fill="#b5c9dc" letter-spacing="1.4">CAD DESIGN  ·  MECHANICAL SYSTEMS  ·  SIMULATION</text>
 <rect x="68" y="220" width="294" height="36" rx="4" fill="#0c2638" stroke="#1fdfff" stroke-opacity=".7"/>
 <circle cx="85" cy="238" r="4" fill="#ffad5c"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
 <text x="100" y="243" font-size="13" fill="#d9f6ff" letter-spacing="2">LEARN / DESIGN / BUILD</text>
 <text x="68" y="307" font-size="11" fill="#789bb7" letter-spacing="2">ENGINEERING • PRECISION • ITERATION</text>
</g>
<g fill="none" stroke="#46dff5" stroke-width="1" opacity=".55"><path d="M770 38H1110M770 33V43M1110 33V43M1140 65V283M1135 65H1145M1135 283H1145"/><path d="M790 50L820 80M1090 50L1060 80" stroke-dasharray="4 4"/></g>
<g font-family="Arial,Helvetica,sans-serif" fill="#78b5cd" font-size="9" letter-spacing="1.4"><text x="940" y="29" text-anchor="middle">DRIVE TRAIN / SECTION A—A</text><text x="1154" y="174" transform="rotate(90 1154 174)" text-anchor="middle">CONCEPT SCHEMATIC</text></g>
<g transform="translate(925 164)">
 <circle r="99" fill="#061522" fill-opacity=".7" stroke="#31ddf7" stroke-opacity=".25" stroke-dasharray="3 7"/>
 <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
  <use href="#tooth"/><use href="#tooth" transform="rotate(30)"/><use href="#tooth" transform="rotate(60)"/><use href="#tooth" transform="rotate(90)"/><use href="#tooth" transform="rotate(120)"/><use href="#tooth" transform="rotate(150)"/><use href="#tooth" transform="rotate(180)"/><use href="#tooth" transform="rotate(210)"/><use href="#tooth" transform="rotate(240)"/><use href="#tooth" transform="rotate(270)"/><use href="#tooth" transform="rotate(300)"/><use href="#tooth" transform="rotate(330)"/>
  <circle r="62" fill="#0c2538" stroke="#b0d7e8" stroke-width="2"/><circle r="51" fill="none" stroke="#31ddf7" stroke-dasharray="5 7"/>
  <path d="M0-51V-34M0 34V51M-51 0H-34M34 0H51M-36-36L-24-24M24 24L36 36M36-36L24-24M-24 24L-36 36" stroke="#a4c9dc" stroke-width="5" stroke-linecap="round"/>
  <circle r="25" fill="#122d40" stroke="#ffad5c" stroke-width="2"/><circle r="14" fill="none" stroke="#ffad5c" stroke-width="2"/><circle r="6" fill="url(#amber)" filter="url(#glow)"/>
 </g>
 <circle r="91" fill="none" stroke="#00d9ff" stroke-opacity=".65" stroke-dasharray="12 15"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/></circle>
</g>
<g transform="translate(1070 242)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="12s" repeatCount="indefinite"/>
 <use href="#toothSmall"/><use href="#toothSmall" transform="rotate(45)"/><use href="#toothSmall" transform="rotate(90)"/><use href="#toothSmall" transform="rotate(135)"/><use href="#toothSmall" transform="rotate(180)"/><use href="#toothSmall" transform="rotate(225)"/><use href="#toothSmall" transform="rotate(270)"/><use href="#toothSmall" transform="rotate(315)"/>
 <circle r="29" fill="#122638" stroke="#ffad5c" stroke-width="2"/><circle r="18" fill="none" stroke="#ffad5c"/><circle r="5" fill="#ffad5c"/>
</g></g>
<g transform="translate(795 88)"><rect x="-20" y="0" width="40" height="90" rx="4" fill="#122b3f" stroke="#83c5df" stroke-width="2"/><path d="M-13 12H13M-13 22H13" stroke="#ffad5c" stroke-width="3"/>
 <g><animateTransform attributeName="transform" type="translate" values="0 0;0 24;0 0;0 -14;0 0" dur="3.2s" repeatCount="indefinite"/><rect x="-14" y="-5" width="28" height="27" rx="3" fill="url(#steel)" stroke="#e2faff"/><path d="M-11 3H11M-11 10H11" stroke="#17344a" stroke-width="2"/><rect x="-4" y="19" width="8" height="82" rx="3" fill="url(#steel)" stroke="#a8d8ed"/><circle cy="103" r="7" fill="#ffad5c" stroke="#ffe1ac"/></g>
 <path d="M-28 -14H28M-28 104H28" stroke="#3c8eaa" stroke-dasharray="3 4"/>
</g>
<path d="M750 220C790 202 825 213 853 230S905 250 930 233" fill="none" stroke="#00d9ff" stroke-width="2" stroke-dasharray="5 8" opacity=".85"><animate attributeName="stroke-dashoffset" from="0" to="-52" dur="2.5s" repeatCount="indefinite"/></path>
<circle r="4" fill="#ffad5c" filter="url(#glow)"><animateMotion dur="4.5s" repeatCount="indefinite" path="M750 220C790 202 825 213 853 230S905 250 930 233"/></circle>
<g stroke="#36e5ff" stroke-width="2" opacity=".55" fill="none"><path d="M28 48V28H48M1152 28H1172V48M28 312V332H48M1152 332V312H1172"/></g>
<text x="1170" y="345" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#688da7" letter-spacing="1.2">ME—01 / PROFILE HEADER</text>
</svg>